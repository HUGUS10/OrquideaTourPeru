<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Orquídea Tour Perú</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../config/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
    <header class="w-full border-b border-slate-200 bg-white">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3"><img src="../img/logo.png" alt="Orquídea Tour Perú" class="w-11 h-11 object-contain"><span class="font-extrabold text-slate-900">ORQUÍDEA <small class="block text-xs font-semibold text-brand-700">TOUR PERÚ</small></span></a>
            <a href="../index.html" class="text-sm font-semibold text-slate-600 hover:text-brand-700">Volver al inicio</a>
        </div>
    </header>
    <main class="flex-1 grid place-items-center px-4 py-10">
        <section class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
            <div class="text-center mb-7"><img src="../img/logo.png" alt="" class="w-16 h-16 object-contain mx-auto"><p class="text-xs font-bold uppercase tracking-widest text-brand-700 mt-3">Tu próximo viaje comienza aquí</p><h1 class="text-2xl font-black text-slate-900 mt-1">Inicia sesión</h1><p class="text-sm text-slate-500 mt-2">Accede a tus reservas y datos de viaje.</p></div>
            <form onsubmit="event.preventDefault(); submitLogin(this);" class="space-y-4">
                <label class="block text-sm font-semibold text-slate-700">Correo electrónico<input name="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
                <label class="block text-sm font-semibold text-slate-700">Contraseña<input name="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-lg border border-slate-300 px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
                <div id="auth-message" class="hidden" role="status" aria-live="polite"></div>
                <button type="submit" class="w-full rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 transition">Iniciar sesión</button>
            </form>
            <p class="text-center text-sm text-slate-600 mt-6">¿Aún no tienes una cuenta? <a href="registro.html" class="font-bold text-brand-700 hover:underline">Regístrate</a></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
