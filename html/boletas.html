<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Comprobantes del cliente.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#16a34a">
    <link rel="icon" type="image/jpeg" href="../img/logo.png">
    <link rel="apple-touch-icon" href="../img/logo.png">
    <title>Comprobantes | Orquídea Tour Perú</title>
    <script src="https://cdn.tailwindcss.com/3.4.5"></script>
    <script src="../config/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="responsive-tables min-h-screen bg-slate-50 text-slate-800">
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
            <a href="admin_cliente.html" class="flex items-center gap-3 text-slate-900 font-extrabold"><img src="../img/logo.png" alt="" class="w-10 h-10 object-contain"><span>ORQUÍDEA TOUR PERÚ<small class="block text-xs text-brand-700 font-semibold">Comprobantes</small></span></a>
            <button type="button" onclick="returnToAccount()" class="text-sm font-semibold text-slate-600 hover:text-brand-700"><i class="fa-solid fa-arrow-left mr-2"></i>Volver a mi cuenta</button>
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
        <div class="mb-6"><h1 class="text-2xl sm:text-3xl font-black text-slate-900">Boletas y facturas</h1><p class="text-sm text-slate-600 mt-2">Descarga los comprobantes internos asociados a tus reservas.</p></div>
        <p class="mb-5 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">Estos archivos son comprobantes internos de referencia y no reemplazan documentos tributarios electrónicos autorizados por SUNAT.</p>
        <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
            <table class="w-full min-w-[680px] text-left text-sm text-slate-700"><thead class="bg-slate-100 text-xs uppercase text-slate-500"><tr><th class="p-3">Número</th><th class="p-3">Tipo</th><th class="p-3">Cliente</th><th class="p-3">Reserva</th><th class="p-3">Fecha</th><th class="p-3">Total</th><th class="p-3 text-right">Archivo</th></tr></thead><tbody id="invoice-list-body" class="divide-y divide-slate-100"></tbody></table>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../config/supabase-config.js"></script>
    <script src="../config/app-config.js"></script>
    <script src="../js/supabase-data.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
