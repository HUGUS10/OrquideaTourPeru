<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Crea tu cuenta en Orquídea Tour Perú y reserva paquetes turísticos a Cusco, Arequipa, Paracas y Puno.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#16a34a">
    <link rel="icon" type="image/jpeg" href="../img/logo.png">
    <link rel="apple-touch-icon" href="../img/logo.png">
    <title>Crear cuenta | Orquídea Tour Perú</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../config/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
    <header class="w-full border-b border-slate-200 bg-white">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3"><img src="../img/logo.png" alt="Orquídea Tour Perú" class="w-11 h-11 object-contain"><span class="font-extrabold text-slate-900">ORQUÍDEA <small class="block text-xs font-semibold text-brand-700">TOUR PERÚ</small></span></a>
            <a href="../index.html" class="text-sm font-semibold text-slate-600 hover:text-brand-700">Volver al inicio</a>
        </div>
    </header>
    <main class="flex-1 grid place-items-center px-4 py-8">
        <section class="w-full max-w-xl bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-8">
            <div class="text-center mb-6"><img src="../img/logo.png" alt="" class="w-14 h-14 object-contain mx-auto"><p class="text-xs font-bold uppercase tracking-widest text-brand-700 mt-2">Únete a nosotros</p><h1 class="text-2xl font-black text-slate-900 mt-1">Crear cuenta</h1><p class="text-sm text-slate-500 mt-2">Regístrate para administrar tus viajes y reservas.</p></div>
            <form onsubmit="event.preventDefault(); submitRegistration(this);" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="text-sm font-semibold text-slate-700">Nombres<input name="firstName" autocomplete="given-name" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
                <label class="text-sm font-semibold text-slate-700">Apellidos<input name="lastName" autocomplete="family-name" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
                <label class="text-sm font-semibold text-slate-700">DNI / Pasaporte<input name="document" autocomplete="off" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
                <label class="text-sm font-semibold text-slate-700">Teléfono<input name="phone" type="tel" autocomplete="tel" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
                <label class="sm:col-span-2 text-sm font-semibold text-slate-700">Correo electrónico<input name="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
                <label class="text-sm font-semibold text-slate-700">Contraseña<input name="password" type="password" autocomplete="new-password" minlength="8" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"><span class="block text-xs font-normal text-slate-500 mt-1">Mínimo 8 caracteres.</span></label>
                <label class="text-sm font-semibold text-slate-700">Confirmar contraseña<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
                <label class="sm:col-span-2 flex items-start gap-2 text-xs text-slate-600"><input name="terms" type="checkbox" required class="mt-0.5 rounded border-slate-300 text-brand-600 focus:ring-brand-500"><span>Acepto los <a href="terminos.html" target="_blank" class="text-brand-700 underline">términos</a> y la <a href="privacidad.html" target="_blank" class="text-brand-700 underline">política de privacidad</a>.</span></label>
                <div id="auth-message" class="hidden sm:col-span-2" role="status" aria-live="polite"></div>
                <button type="submit" class="sm:col-span-2 w-full rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 transition">Crear cuenta</button>
            </form>
            <p class="text-center text-sm text-slate-600 mt-5">¿Ya tienes cuenta? <a href="login.html" class="font-bold text-brand-700 hover:underline">Inicia sesión</a></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
